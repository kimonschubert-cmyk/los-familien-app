<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOS! – Familien-Starthelfer</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #f5f7fa;
  color: #222;
}

header {
  background: white;
  padding: 24px 18px 18px;
  text-align: center;
  border-bottom: 1px solid #ddd;
}

header h1 {
  margin: 0;
  font-size: 34px;
}

header p {
  margin: 6px 0 0;
  color: #666;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 18px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

h2 {
  margin-top: 0;
}

button {
  border: none;
  border-radius: 13px;
  padding: 12px 16px;
  font-size: 16px;
  cursor: pointer;
}

.primary {
  background: #111;
  color: white;
}

.secondary {
  background: #eee;
}

.danger {
  background: #ffe5e5;
  color: #b00020;
}

.list-button {
  width: 100%;
  margin: 6px 0;
  text-align: left;
  background: #f1f3f5;
  font-size: 17px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 12px;
  font-size: 16px;
  margin-bottom: 10px;
}

.person {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px;
  background: #f5f5f5;
  border-radius: 12px;
  margin-bottom: 8px;
}

.person-info {
  font-size: 16px;
}

.small {
  color: #777;
  font-size: 13px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}

.chip {
  background: #eee;
  padding: 10px 13px;
  border-radius: 20px;
  cursor: pointer;
}

.chip.active {
  background: #111;
  color: white;
}

.check-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px;
  background: #f7f7f7;
  border-radius: 12px;
  margin-bottom: 8px;
}

.check-item input {
  width: 22px;
  height: 22px;
  margin: 0;
}

.checked {
  text-decoration: line-through;
  color: #888;
}

.section-title {
  margin-top: 20px;
  margin-bottom: 10px;
  font-size: 18px;
  font-weight: 600;
}

.hero {
  text-align: center;
  padding: 8px 0 18px;
}

.hero-title {
  font-size: 24px;
  font-weight: 700;
}

.hero-text {
  color: #666;
  margin-top: 6px;
}

.badge {
  display: inline-block;
  background: #eee;
  padding: 6px 10px;
  border-radius: 15px;
  font-size: 13px;
  margin: 3px;
}

.empty {
  color: #777;
  text-align: center;
  padding: 15px;
}

.progress {
  height: 9px;
  background: #eee;
  border-radius: 10px;
  overflow: hidden;
  margin: 12px 0 18px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #111;
  transition: width .2s;
}

.category {
  font-size: 13px;
  color: #777;
  margin-bottom: 5px;
}

</style>
</head>

<body>

<header>

  <h1>🚀 LOS!</h1>

  <p>Der Familien-Starthelfer</p>

</header>


<main>


<!-- ========================= -->
<!-- STARTSEITE -->
<!-- ========================= -->

<div id="home">

  <div class="card">

    <h2>👨‍👩‍👧‍👦 Meine Familie</h2>

    <div id="familyList"></div>

    <input
      id="personName"
      placeholder="Name"
    >

    <input
      id="personAge"
      type="number"
      min="0"
      max="100"
      placeholder="Alter"
    >

    <button
      class="primary"
      onclick="addPerson()"
    >
      ＋ Familienmitglied hinzufügen
    </button>

  </div>


  <div class="card">

    <h2>🚀 Was machen wir?</h2>

    <p class="small">
      Wähle zuerst aus, was ihr heute vorhabt.
    </p>

    <div id="activityList"></div>

  </div>


  <div class="card">

    <h2>📋 Eigene Listen</h2>

    <input
      id="newListName"
      placeholder="z.B. Zoo, Urlaub, Oma"
    >

    <button
      class="primary"
      onclick="createList()"
    >
      ＋ Eigene Liste erstellen
    </button>

    <div id="customLists"></div>

  </div>

</div>



<!-- ========================= -->
<!-- PERSONENAUSWAHL -->
<!-- ========================= -->

<div id="peopleScreen" class="hidden">

  <button
    class="secondary"
    onclick="goHome()"
  >
    ← Zurück
  </button>


  <div class="card">

    <div class="hero">

      <div
        class="hero-title"
        id="selectedActivityTitle"
      ></div>

      <div class="hero-text">
        Wer kommt mit?
      </div>

    </div>


    <div
      id="peopleSelector"
      class="chips"
    ></div>


    <button
      class="primary"
      style="width:100%;"
      onclick="createFamilyChecklist()"
    >
      🚀 Liste erstellen
    </button>

  </div>

</div>



<!-- ========================= -->
<!-- CHECKLISTE -->
<!-- ========================= -->

<div id="listScreen" class="hidden">

  <button
    class="secondary"
    onclick="backToPeople()"
  >
    ← Zurück
  </button>


  <div class="card">

    <div class="hero">

      <div
        class="hero-title"
        id="listTitle"
      ></div>

      <div
        class="hero-text"
        id="listSubtitle"
      ></div>

    </div>


    <div class="progress">

      <div
        id="progressBar"
        class="progress-bar"
      ></div>

    </div>


    <div
      id="checklist"
    ></div>


    <br>


    <button
      class="secondary"
      onclick="addCustomItem()"
    >
      ＋ Punkt hinzufügen
    </button>

    <br><br>


    <button
      class="danger"
      onclick="resetChecklist()"
    >
      ↻ Erledigte Punkte zurücksetzen
    </button>

  </div>

</div>

</main>



<script>


/* =====================================
   DATEN
===================================== */

let family =
  JSON.parse(
    localStorage.getItem("los_family") || "[]"
  );


let customLists =
  JSON.parse(
    localStorage.getItem("los_custom_lists") || "[]"
  );


let checkedItems =
  JSON.parse(
    localStorage.getItem("los_checked_items") || "{}"
  );


let currentActivity = null;

let selectedPeople = [];

let currentItems = [];


/* =====================================
   AKTIVITÄTEN
===================================== */

const activities = {

  "🏊 Schwimmbad": {

    common: [
      "Handtücher",
      "Sonnencreme",
      "Trinkflaschen",
      "Wechselkleidung"
    ],

    children: {

      baby: [
        "Schwimmwindel",
        "Bademantel"
      ],

      small: [
        "Badehose/Badeanzug",
        "Schwimmbrille",
        "Badeschuhe"
      ],

      older: [
        "Badehose/Badeanzug",
        "Schwimmbrille",
        "Badeschuhe"
      ]

    }

  },


  "🌳 Spielplatz": {

    common: [
      "Trinkflaschen",
      "Taschentücher",
      "Sonnencreme"
    ],

    children: {

      baby: [
        "Wechselkleidung",
        "Snack",
        "Sonnenhut"
      ],

      small: [
        "Wechselkleidung",
        "Snack"
      ],

      older: [
        "Trinkflasche",
        "Snack"
      ]

    }

  },


  "🏫 Kindergarten": {

    common: [],

    children: {

      baby: [
        "Wechselkleidung",
        "Windeln",
        "Feuchttücher"
      ],

      small: [
        "Rucksack",
        "Trinkflasche",
        "Brotdose",
        "Wechselkleidung"
      ],

      older: [
        "Rucksack",
        "Trinkflasche",
        "Brotdose"
      ]

    }

  },


  "👵 Oma & Opa": {

    common: [
      "Wechselkleidung",
      "Trinkflaschen"
    ],

    children: {

      baby: [
        "Windeln",
        "Feuchttücher",
        "Lieblingskuscheltier"
      ],

      small: [
        "Lieblingsspielzeug",
        "Snack"
      ],

      older: [
        "Lieblingsspielzeug",
        "Buch/Spiel"
      ]

    }

  },


  "🛒 Einkaufen": {

    common: [
      "Einkaufsliste",
      "Trinkflaschen"
    ],

    children: {

      baby: [
        "Snacks"
      ],

      small: [
        "Snack",
        "kleines Spielzeug"
      ],

      older: [
        "Snack",
        "Kopfhörer"
      ]

    }

  },


  "✈️ Urlaub": {

    common: [
      "Dokumente",
      "Kleidung",
      "Unterwäsche",
      "Schuhe",
      "Waschzeug"
    ],

    children: {

      baby: [
        "Windeln",
        "Feuchttücher",
        "Lieblingskuscheltier",
        "Sonnenhut"
      ],

      small: [
        "Lieblingsspielzeug",
        "Sonnenhut",
        "Reiseunterhaltung"
      ],

      older: [
        "Kopfhörer",
        "Reiseunterhaltung",
        "Sonnenhut"
      ]

    }

  }

};


/* =====================================
   SPEICHERN
===================================== */

function saveAll() {

  localStorage.setItem(
    "los_family",
    JSON.stringify(family)
  );

  localStorage.setItem(
    "los_custom_lists",
    JSON.stringify(customLists)
  );

  localStorage.setItem(
    "los_checked_items",
    JSON.stringify(checkedItems)
  );

}


/* =====================================
   HOME
===================================== */

function renderHome() {

  hideAll();

  document
    .getElementById("home")
    .classList.remove("hidden");

  renderFamily();

  renderActivities();

  renderCustomLists();

}


function hideAll() {

  document
    .getElementById("home")
    .classList.add("hidden");

  document
    .getElementById("peopleScreen")
    .classList.add("hidden");

  document
    .getElementById("listScreen")
    .classList.add("hidden");

}


/* =====================================
   FAMILIE
===================================== */

function renderFamily() {

  const container =
    document.getElementById("familyList");

  container.innerHTML = "";

  if (family.length === 0) {

    container.innerHTML =
      '<div class="empty">Noch keine Familienmitglieder</div>';

    return;
  }


  family.forEach(
    (person, index) => {

      const div =
        document.createElement("div");

      div.className = "person";

      div.innerHTML = `

        <div class="person-info">

          👤 <strong>
            ${escapeHTML(person.name)}
          </strong>

          <div class="small">
            ${person.age} Jahre
          </div>

        </div>

        <button
          class="danger"
          onclick="deletePerson(${index})"
        >
          ✕
        </button>

      `;

      container.appendChild(div);

    }
  );

}


function addPerson() {

  const name =
    document
      .getElementById("personName")
      .value
      .trim();

  const age =
    parseInt(
      document
        .getElementById("personAge")
        .value
    );


  if (!name || isNaN(age)) {

    alert(
      "Bitte Name und Alter eingeben."
    );

    return;
  }


  family.push({

    id: Date.now(),

    name: name,

    age: age

  });


  document
    .getElementById("personName")
    .value = "";

  document
    .getElementById("personAge")
    .value = "";


  saveAll();

  renderHome();

}


function deletePerson(index) {

  if (
    !confirm(
      "Familienmitglied wirklich löschen?"
    )
  ) {
    return;
  }


  family.splice(index, 1);

  saveAll();

  renderHome();

}


/* =====================================
   AKTIVITÄTEN
===================================== */

function renderActivities() {

  const container =
    document.getElementById("activityList");

  container.innerHTML = "";


  Object.keys(activities).forEach(
    name => {

      const button =
        document.createElement("button");

      button.className =
        "list-button";

      button.textContent = name;

      button.onclick =
        () => selectActivity(name);

      container.appendChild(button);

    }
  );

}


function selectActivity(name) {

  currentActivity = name;

  selectedPeople = [];

  hideAll();

  document
    .getElementById("peopleScreen")
    .classList.remove("hidden");


  document
    .getElementById("selectedActivityTitle")
    .textContent = name;


  renderPeopleSelector();

}


/* =====================================
   PERSONENAUSWAHL
===================================== */

function renderPeopleSelector() {

  const container =
    document.getElementById(
      "peopleSelector"
    );

  container.innerHTML = "";


  if (family.length === 0) {

    container.innerHTML = `

      <div class="empty">

        Bitte zuerst Familienmitglieder
        hinzufügen.

      </div>

    `;

    return;
  }


  family.forEach(
    person => {

      const button =
        document.createElement("div");

      button.className = "chip";


      if (
        selectedPeople.includes(
          person.id
        )
      ) {

        button.classList.add(
          "active"
        );

      }


      button.textContent =
        `${person.name} (${person.age})`;


      button.onclick =
        () => togglePerson(
          person.id
        );


      container.appendChild(button);

    }
  );

}


function togglePerson(id) {

  const index =
    selectedPeople.indexOf(id);


  if (index === -1) {

    selectedPeople.push(id);

  } else {

    selectedPeople.splice(
      index,
      1
    );

  }


  renderPeopleSelector();

}


/* =====================================
   LISTE ERSTELLEN
===================================== */

function createFamilyChecklist() {

  if (
    selectedPeople.length === 0
  ) {

    alert(
      "Bitte mindestens eine Person auswählen."
    );

    return;
  }


  buildChecklist();


  hideAll();

  document
    .getElementById("listScreen")
    .classList.remove("hidden");


  document
    .getElementById("listTitle")
    .textContent =
      currentActivity;


  document
    .getElementById("listSubtitle")
    .textContent =
      "LOS! hat eure persönliche Liste zusammengestellt";


  renderChecklist();

}


/* =====================================
   CHECKLISTE ERZEUGEN
===================================== */

function buildChecklist() {

  currentItems = [];


  const activity =
    activities[currentActivity];


  /*
     GEMEINSAME SACHEN
  */

  activity.common.forEach(
    item => {

      addItem(
        item,
        "Für alle",
        null
      );

    }
  );


  /*
     PERSONEN
  */

  selectedPeople.forEach(
    personId => {

      const person =
        family.find(
          p => p.id === personId
        );


      if (!person) return;


      let group =
        getAgeGroup(person.age);


      let items =
        activity.children[group] || [];


      items.forEach(
        item => {

          addItem(
            item,
            person.name,
            person.id
          );

        }
      );

    }
  );

}


/* =====================================
   ALTERSGRUPPE
===================================== */

function getAgeGroup(age) {

  if (age <= 3) {

    return "baby";

  }


  if (age <= 6) {

    return "small";

  }


  return "older";

}


/* =====================================
   PUNKT HINZUFÜGEN
===================================== */

function addItem(
  item,
  personName,
  personId
) {

  /*
     Duplikate bei derselben Person
     verhindern.
  */

  const exists =
    currentItems.some(
      x =>
        x.item === item &&
        x.personId === personId
    );


  if (exists) return;


  currentItems.push({

    id:
      createItemId(
        currentActivity,
        item,
        personId
      ),

    item: item,

    personName:
      personName,

    personId:
      personId,

    category:
      personId
        ? "Person"
        : "Gemeinsam"

  });

}


/* =====================================
   CHECKLISTE ANZEIGEN
===================================== */

function renderChecklist() {

  const container =
    document.getElementById(
      "checklist"
    );

  container.innerHTML = "";


  if (
    currentItems.length === 0
  ) {

    container.innerHTML =
      '<div class="empty">Keine Punkte vorhanden.</div>';

    updateProgress();

    return;
  }


  /*
     GEMEINSAM
  */

  const common =
    currentItems.filter(
      x => !x.personId
    );


  if (common.length) {

    const title =
      document.createElement("div");

    title.className =
      "section-title";

    title.textContent =
      "👨‍👩‍👧‍👦 Für alle";

    container.appendChild(title);


    common.forEach(
      item => renderItem(
        item,
        container
      )
    );

  }


  /*
     PERSONEN
  */

  selectedPeople.forEach(
    personId => {

      const person =
        family.find(
          p => p.id === personId
        );

      if (!person) return;


      const personItems =
        currentItems.filter(
          x =>
            x.personId === person.id
        );


      if (!personItems.length) {
        return;
      }


      const title =
        document.createElement("div");

      title.className =
        "section-title";

      title.textContent =
        `👤 ${person.name} (${person.age})`;


      container.appendChild(title);


      personItems.forEach(
        item =>
          renderItem(
            item,
            container
          )
      );

    }
  );


  updateProgress();

}


function renderItem(
  item,
  container
) {

  const wrapper =
    document.createElement("label");

  wrapper.className =
    "check-item";


  const checkbox =
    document.createElement("input");

  checkbox.type =
    "checkbox";


  checkbox.checked =
    checkedItems[item.id] === true;


  const text =
    document.createElement("span");

  text.textContent =
    item.item;


  if (checkbox.checked) {

    text.classList.add(
      "checked"
    );

  }


  checkbox.onchange = () => {

    checkedItems[item.id] =
      checkbox.checked;


    if (
      checkbox.checked
    ) {

      text.classList.add(
        "checked"
      );

    } else {

      text.classList.remove(
        "checked"
      );

    }


    saveAll();

    updateProgress();

  };


  wrapper.appendChild(
    checkbox
  );

  wrapper.appendChild(
    text
  );

  container.appendChild(
    wrapper
  );

}


/* =====================================
   FORTSCHRITT
===================================== */

function updateProgress() {

  const total =
    currentItems.length;


  if (!total) {

    document
      .getElementById(
        "progressBar"
      )
      .style.width = "0%";

    return;
  }


  const done =
    currentItems.filter(
      item =>
        checkedItems[item.id]
    ).length;


  const percent =
    Math.round(
      (done / total) * 100
    );


  document
    .getElementById(
      "progressBar"
    )
    .style.width =
      percent + "%";

}


/* =====================================
   EIGENER PUNKT
===================================== */

function addCustomItem() {

  const item =
    prompt(
      "Was soll noch auf die Liste?"
    );


  if (
    !item ||
    !item.trim()
  ) {

    return;

  }


  addItem(
    item.trim(),
    "Eigener Punkt",
    "custom"
  );


  renderChecklist();

}


/* =====================================
   RESET
===================================== */

function resetChecklist() {

  if (
    !confirm(
      "Alle erledigten Punkte zurücksetzen?"
    )
  ) {

    return;

  }


  currentItems.forEach(
    item => {

      delete checkedItems[
        item.id
      ];

    }
  );


  saveAll();

  renderChecklist();

}


/* =====================================
   EIGENE LISTEN
===================================== */

function createList() {

  const input =
    document.getElementById(
      "newListName"
    );


  const name =
    input.value.trim();


  if (!name) {

    alert(
      "Bitte einen Namen eingeben."
    );

    return;

  }


  customLists.push({

    name: name,

    items: []

  });


  input.value = "";


  saveAll();

  renderHome();

}


function renderCustomLists() {

  const container =
    document.getElementById(
      "customLists"
    );


  container.innerHTML = "";


  customLists.forEach(
    list => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "list-button";


      button.textContent =
        "📌 " + list.name;


      button.onclick =
        () => openCustomList(
          list
        );


      container.appendChild(
        button
      );

    }
  );

}


function openCustomList(list) {

  currentActivity =
    list.name;


  selectedPeople = [];


  hideAll();


  document
    .getElementById(
      "peopleScreen"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "selectedActivityTitle"
    )
    .textContent =
      "📌 " + list.name;


  renderPeopleSelector();

}


/* =====================================
   ZURÜCK
===================================== */

function backToPeople() {

  hideAll();

  document
    .getElementById(
      "peopleScreen"
    )
    .classList.remove(
      "hidden"
    );


  renderPeopleSelector();

}


function goHome() {

  currentActivity =
    null;

  selectedPeople = [];

  renderHome();

}


/* =====================================
   ID
===================================== */

function createItemId(
  activity,
  item,
  personId
) {

  return (

    activity +
    "|" +
    item +
    "|" +
    (personId || "all")

  );

}


/* =====================================
   HTML SICHER MACHEN
===================================== */

function escapeHTML(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================
   START
===================================== */

renderHome();

</script>

</body>
</html>
