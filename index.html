<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOS! – Familien-Starthelfer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #f5f7fa;
  color: #222;
}

header {
  background: white;
  padding: 24px 18px 18px;
  text-align: center;
  border-bottom: 1px solid #ddd;
}

header h1 {
  margin: 0;
  font-size: 32px;
}

header p {
  margin: 6px 0 0;
  color: #666;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 18px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

h2 {
  margin-top: 0;
}

button {
  border: none;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 16px;
  cursor: pointer;
}

.primary {
  background: #111;
  color: white;
}

.secondary {
  background: #eee;
}

.danger {
  background: #ffe5e5;
  color: #b00020;
}

.list-button {
  width: 100%;
  margin: 6px 0;
  text-align: left;
  background: #f1f3f5;
  font-size: 17px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 12px;
  font-size: 16px;
  margin-bottom: 10px;
}

.person {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px;
  background: #f5f5f5;
  border-radius: 12px;
  margin-bottom: 8px;
}

.person-info {
  font-size: 16px;
}

.small {
  color: #777;
  font-size: 13px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}

.chip {
  background: #eee;
  padding: 10px 13px;
  border-radius: 20px;
  cursor: pointer;
}

.chip.active {
  background: #111;
  color: white;
}

.check-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px;
  background: #f7f7f7;
  border-radius: 12px;
  margin-bottom: 8px;
}

.check-item input {
  width: 22px;
  height: 22px;
  margin: 0;
}

.checked {
  text-decoration: line-through;
  color: #888;
}

.section-title {
  margin-top: 22px;
  margin-bottom: 10px;
  font-size: 18px;
}

.back {
  margin-bottom: 15px;
}

.hidden {
  display: none;
}

.empty {
  color: #777;
  text-align: center;
  padding: 15px;
}
</style>
</head>

<body>

<header>
  <h1>🚀 LOS!</h1>
  <p>Der Familien-Starthelfer</p>
</header>

<main>

<!-- STARTSEITE -->
<div id="home">

  <div class="card">
    <h2>👨‍👩‍👧‍👦 Meine Familie</h2>

    <div id="familyList"></div>

    <input id="personName" placeholder="Name">
    <input id="personAge" type="number" min="0" max="100" placeholder="Alter">

    <button class="primary" onclick="addPerson()">
      ＋ Familienmitglied hinzufügen
    </button>
  </div>

  <div class="card">
    <h2>📋 Was machen wir?</h2>
    <div id="lists"></div>
  </div>

  <div class="card">
    <h2>➕ Eigene Liste</h2>

    <input id="newListName" placeholder="z.B. Zoo, Urlaub, Oma">

    <button class="primary" onclick="createList()">
      Liste erstellen
    </button>

    <div id="customLists"></div>
  </div>

</div>


<!-- LISTE -->
<div id="listScreen" class="hidden">

  <button class="secondary back" onclick="goHome()">
    ← Zurück
  </button>

  <div class="card">

    <h2 id="listTitle"></h2>

    <div class="section-title">
      👨‍👩‍👧‍👦 Für wen?
    </div>

    <div id="personSelector" class="chips"></div>

    <div id="suggestions"></div>

  </div>

  <div class="card">

    <div class="section-title">
      📝 Deine Checkliste
    </div>

    <div id="checklist"></div>

    <button class="secondary" onclick="addCustomItem()">
      ＋ Punkt hinzufügen
    </button>

    <br><br>

    <button class="danger" onclick="resetChecklist()">
      ↻ Erledigte Punkte zurücksetzen
    </button>

  </div>

</div>

</main>


<script>

let family = JSON.parse(
  localStorage.getItem("los_family") || "[]"
);

let customLists = JSON.parse(
  localStorage.getItem("los_custom_lists") || "[]"
);

let checkedItems = JSON.parse(
  localStorage.getItem("los_checked_items") || "{}"
);

let assignments = JSON.parse(
  localStorage.getItem("los_assignments") || "{}"
);

let currentList = null;


/* STANDARDLISTEN */

const defaultLists = {

  "🏊 Schwimmbad": [
    "Handtücher",
    "Badesachen",
    "Trinkflaschen",
    "Sonnencreme",
    "Wechselkleidung"
  ],

  "🏫 Kindergarten": [
    "Rucksack",
    "Trinkflasche",
    "Brotdose",
    "Wechselkleidung"
  ],

  "🌳 Spielplatz": [
    "Trinkflaschen",
    "Sonnencreme",
    "Taschentücher",
    "Wechselkleidung"
  ],

  "👵 Oma & Opa": [
    "Wechselkleidung",
    "Lieblingsspielzeug",
    "Trinkflasche",
    "Snacks"
  ],

  "🛒 Einkaufen": [
    "Einkaufsliste",
    "Trinkflaschen",
    "Snacks"
  ],

  "✈️ Urlaub": [
    "Kleidung",
    "Unterwäsche",
    "Schuhe",
    "Waschzeug",
    "Medikamente",
    "Dokumente"
  ]

};


/* ALTERSSPEZIFISCHE EMPFEHLUNGEN */

const ageSuggestions = {

  "🏊 Schwimmbad": [
    {
      min: 0,
      max: 3,
      items: [
        "Schwimmwindel",
        "Badehose",
        "Bademantel"
      ]
    },
    {
      min: 4,
      max: 6,
      items: [
        "Badehose/Badeanzug",
        "Schwimmbrille",
        "Badeschuhe"
      ]
    },
    {
      min: 7,
      max: 17,
      items: [
        "Badehose/Badeanzug",
        "Schwimmbrille",
        "Badeschuhe"
      ]
    }
  ],

  "✈️ Urlaub": [
    {
      min: 0,
      max: 3,
      items: [
        "Windeln",
        "Feuchttücher",
        "Lieblingskuscheltier"
      ]
    },
    {
      min: 4,
      max: 6,
      items: [
        "Lieblingsspielzeug",
        "Sonnenhut",
        "Reiseunterhaltung"
      ]
    },
    {
      min: 7,
      max: 17,
      items: [
        "Kopfhörer",
        "Reiseunterhaltung",
        "Sonnenhut"
      ]
    }
  ],

  "🌳 Spielplatz": [
    {
      min: 0,
      max: 3,
      items: [
        "Wechselkleidung",
        "Snack",
        "Sonnenhut"
      ]
    },
    {
      min: 4,
      max: 6,
      items: [
        "Wechselkleidung",
        "Snack",
        "Trinkflasche"
      ]
    }
  ]

};


/* SPEICHERN */

function saveAll() {

  localStorage.setItem(
    "los_family",
    JSON.stringify(family)
  );

  localStorage.setItem(
    "los_custom_lists",
    JSON.stringify(customLists)
  );

  localStorage.setItem(
    "los_checked_items",
    JSON.stringify(checkedItems)
  );

  localStorage.setItem(
    "los_assignments",
    JSON.stringify(assignments)
  );
}


/* STARTSEITE */

function renderHome() {

  document.getElementById("home").classList.remove("hidden");
  document.getElementById("listScreen").classList.add("hidden");

  renderFamily();
  renderLists();
  renderCustomLists();
}


/* FAMILIE */

function renderFamily() {

  const container =
    document.getElementById("familyList");

  container.innerHTML = "";

  if (family.length === 0) {

    container.innerHTML =
      '<div class="empty">Noch keine Familienmitglieder</div>';

    return;
  }

  family.forEach((person, index) => {

    const div = document.createElement("div");

    div.className = "person";

    div.innerHTML = `
      <div class="person-info">
        👤 <strong>${escapeHTML(person.name)}</strong>
        <div class="small">${person.age} Jahre</div>
      </div>

      <button class="danger"
        onclick="deletePerson(${index})">
        ✕
      </button>
    `;

    container.appendChild(div);
  });
}


function addPerson() {

  const name =
    document.getElementById("personName").value.trim();

  const age =
    parseInt(document.getElementById("personAge").value);

  if (!name || isNaN(age)) {

    alert("Bitte Name und Alter eingeben.");

    return;
  }

  family.push({
    id: Date.now(),
    name: name,
    age: age
  });

  document.getElementById("personName").value = "";
  document.getElementById("personAge").value = "";

  saveAll();
  renderHome();
}


function deletePerson(index) {

  if (!confirm("Familienmitglied wirklich löschen?")) {
    return;
  }

  family.splice(index, 1);

  saveAll();
  renderHome();
}


/* LISTEN */

function renderLists() {

  const container =
    document.getElementById("lists");

  container.innerHTML = "";

  Object.keys(defaultLists).forEach(name => {

    const button =
      document.createElement("button");

    button.className = "list-button";
    button.textContent = name;

    button.onclick = () => openList(name);

    container.appendChild(button);
  });
}


function renderCustomLists() {

  const container =
    document.getElementById("customLists");

  container.innerHTML = "";

  if (customLists.length === 0) {
    return;
  }

  customLists.forEach(list => {

    const button =
      document.createElement("button");

    button.className = "list-button";
    button.textContent = "📌 " + list.name;

    button.onclick = () => openList(list.name);

    container.appendChild(button);
  });
}


function createList() {

  const input =
    document.getElementById("newListName");

  const name =
    input.value.trim();

  if (!name) {
    alert("Bitte einen Namen eingeben.");
    return;
  }

  customLists.push({
    name: name,
    items: []
  });

  input.value = "";

  saveAll();
  renderHome();
}


/* LISTE ÖFFNEN */

function openList(name) {

  currentList = name;

  document.getElementById("home")
    .classList.add("hidden");

  document.getElementById("listScreen")
    .classList.remove("hidden");

  document.getElementById("listTitle")
    .textContent = name;

  renderPersonSelector();
  renderChecklist();
  renderSuggestions();
}


/* PERSONENAUSWAHL */

function renderPersonSelector() {

  const container =
    document.getElementById("personSelector");

  container.innerHTML = "";

  if (family.length === 0) {

    container.innerHTML =
      '<div class="empty">Füge zuerst Familienmitglieder hinzu.</div>';

    return;
  }

  family.forEach(person => {

    const button =
      document.createElement("div");

    button.className = "chip";

    const selected =
      assignments[currentList]?.includes(person.id);

    if (selected) {
      button.classList.add("active");
    }

    button.textContent =
      `${person.name} (${person.age})`;

    button.onclick = () => {

      togglePerson(person.id);

    };

    container.appendChild(button);
  });
}


function togglePerson(personId) {

  if (!assignments[currentList]) {
    assignments[currentList] = [];
  }

  const list =
    assignments[currentList];

  const index =
    list.indexOf(personId);

  if (index === -1) {
    list.push(personId);
  } else {
    list.splice(index, 1);
  }

  saveAll();

  renderPersonSelector();
  renderChecklist();
  renderSuggestions();
}


/* CHECKLISTE */

function getCurrentItems() {

  if (defaultLists[currentList]) {

    return [...defaultLists[currentList]];
  }

  const custom =
    customLists.find(
      list => list.name === currentList
    );

  return custom ? [...custom.items] : [];
}


function renderChecklist() {

  const container =
    document.getElementById("checklist");

  container.innerHTML = "";

  const baseItems =
    getCurrentItems();

  const selected =
    assignments[currentList] || [];

  let allItems = [];

  baseItems.forEach(item => {

    allItems.push({
      item: item,
      personId: null
    });

  });


  selected.forEach(personId => {

    const person =
      family.find(p => p.id === personId);

    if (!person) return;

    const suggestions =
      getAgeSuggestions(person);

    suggestions.forEach(item => {

      allItems.push({
        item: item,
        personId: person.id
      });

    });

  });


  if (allItems.length === 0) {

    container.innerHTML =
      '<div class="empty">Noch keine Punkte vorhanden.</div>';

    return;
  }


  allItems.forEach((entry, index) => {

    const key =
      makeItemKey(
        currentList,
        entry.item,
        entry.personId,
        index
      );

    const wrapper =
      document.createElement("label");

    wrapper.className = "check-item";

    const checkbox =
      document.createElement("input");

    checkbox.type = "checkbox";

    checkbox.checked =
      checkedItems[key] === true;

    const text =
      document.createElement("span");

    let label =
      entry.item;

    if (entry.personId) {

      const person =
        family.find(
          p => p.id === entry.personId
        );

      if (person) {

        label =
          `${entry.item} – ${person.name}`;

      }

    } else {

      label =
        `${entry.item} – für alle`;

    }

    text.textContent = label;

    if (checkbox.checked) {
      text.classList.add("checked");
    }

    checkbox.onchange = () => {

      checkedItems[key] =
        checkbox.checked;

      saveAll();

      if (checkbox.checked) {
        text.classList.add("checked");
      } else {
        text.classList.remove("checked");
      }

    };

    wrapper.appendChild(checkbox);
    wrapper.appendChild(text);

    container.appendChild(wrapper);

  });

}


/* ALTERSEMPFEHLUNGEN */

function getAgeSuggestions(person) {

  const rules =
    ageSuggestions[currentList];

  if (!rules) {
    return [];
  }

  const result = [];

  rules.forEach(rule => {

    if (
      person.age >= rule.min &&
      person.age <= rule.max
    ) {

      rule.items.forEach(item => {

        if (!result.includes(item)) {
          result.push(item);
        }

      });

    }

  });

  return result;
}


function renderSuggestions() {

  const container =
    document.getElementById("suggestions");

  container.innerHTML = "";

  const selected =
    assignments[currentList] || [];

  if (selected.length === 0) {
    return;
  }

  const title =
    document.createElement("div");

  title.className = "section-title";

  title.textContent =
    "💡 Altersabhängige Vorschläge";

  container.appendChild(title);


  selected.forEach(personId => {

    const person =
      family.find(p => p.id === personId);

    if (!person) return;

    const suggestions =
      getAgeSuggestions(person);

    if (suggestions.length === 0) {
      return;
    }

    const div =
      document.createElement("div");

    div.className = "small";

    div.style.marginBottom = "8px";

    div.innerHTML =
      `<strong>${escapeHTML(person.name)}</strong> (${person.age}): ${suggestions.map(escapeHTML).join(", ")}`;

    container.appendChild(div);

  });

}


/* EIGENE PUNKTE */

function addCustomItem() {

  const custom =
    customLists.find(
      list => list.name === currentList
    );

  if (!custom) {

    alert(
      "Eigene Punkte kannst du bei einer eigenen Liste hinzufügen."
    );

    return;
  }

  const item =
    prompt("Was soll auf die Liste?");

  if (!item || !item.trim()) {
    return;
  }

  custom.items.push(item.trim());

  saveAll();
  renderChecklist();
}


/* RESET */

function resetChecklist() {

  if (!confirm(
    "Alle erledigten Punkte dieser Liste zurücksetzen?"
  )) {
    return;
  }

  Object.keys(checkedItems).forEach(key => {

    if (key.startsWith(currentList + "|")) {
      delete checkedItems[key];
    }

  });

  saveAll();

  renderChecklist();
}


/* ZURÜCK */

function goHome() {

  currentList = null;

  renderHome();
}


/* HILFSFUNKTIONEN */

function makeItemKey(
  list,
  item,
  personId,
  index
) {

  return (
    list +
    "|" +
    item +
    "|" +
    (personId || "all") +
    "|" +
    index
  );
}


function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* START */

renderHome();

</script>

</body>
</html>
