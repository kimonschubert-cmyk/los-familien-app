<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LOS! – Familien-Starthelfer</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #f5f7fa;
  color: #222;
}

header {
  background: white;
  padding: 24px 18px 18px;
  text-align: center;
  border-bottom: 1px solid #ddd;
}

header h1 {
  margin: 0;
  font-size: 34px;
}

header p {
  margin: 6px 0 0;
  color: #666;
}

main {
  max-width: 680px;
  margin: auto;
  padding: 18px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

h2 {
  margin-top: 0;
}

button {
  border: none;
  border-radius: 13px;
  padding: 12px 16px;
  font-size: 16px;
  cursor: pointer;
}

.primary {
  background: #111;
  color: white;
}

.secondary {
  background: #eee;
}

.danger {
  background: #ffe5e5;
  color: #b00020;
}

.list-button {
  width: 100%;
  margin: 6px 0;
  text-align: left;
  background: #f1f3f5;
  font-size: 17px;
}

input,
select {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 12px;
  font-size: 16px;
  margin-bottom: 10px;
  background: white;
}

.hero {
  text-align: center;
  padding: 8px 0 18px;
}

.hero-title {
  font-size: 24px;
  font-weight: 700;
}

.hero-text {
  color: #666;
  margin-top: 6px;
}

.small {
  color: #777;
  font-size: 13px;
}

.empty {
  color: #777;
  text-align: center;
  padding: 15px;
}

.person {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px;
  background: #f5f5f5;
  border-radius: 12px;
  margin-bottom: 8px;
}

.person-info {
  font-size: 16px;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}

.chip {
  background: #eee;
  padding: 10px 13px;
  border-radius: 20px;
  cursor: pointer;
}

.chip.active {
  background: #111;
  color: white;
}

.section-title {
  margin-top: 20px;
  margin-bottom: 10px;
  font-size: 18px;
  font-weight: 600;
}

.check-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px;
  background: #f7f7f7;
  border-radius: 12px;
  margin-bottom: 8px;
}

.check-item input {
  width: 22px;
  height: 22px;
  margin: 0;
}

.checked {
  text-decoration: line-through;
  color: #888;
}

.progress {
  height: 9px;
  background: #eee;
  border-radius: 10px;
  overflow: hidden;
  margin: 12px 0 18px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #111;
  transition: width .2s;
}

.activity-card {
  border: 1px solid #e4e4e4;
  border-radius: 17px;
  padding: 15px;
  margin-bottom: 12px;
  background: white;
}

.activity-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
}

.activity-name {
  font-size: 19px;
  font-weight: 700;
}

.activity-description {
  color: #666;
  margin-top: 5px;
  line-height: 1.4;
}

.activity-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 12px 0;
}

.badge {
  background: #f0f1f2;
  padding: 6px 9px;
  border-radius: 14px;
  font-size: 13px;
}

.activity-button {
  width: 100%;
  margin-top: 5px;
}

.weather-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.weather-button {
  background: #eee;
}

.weather-button.active {
  background: #111;
  color: white;
}

.transport-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.transport-button {
  background: #eee;
}

.transport-button.active {
  background: #111;
  color: white;
}

.summary {
  background: #f1f3f5;
  border-radius: 14px;
  padding: 13px;
  margin-top: 12px;
}

.notice {
  background: #fff8dc;
  border-radius: 14px;
  padding: 12px;
  color: #665500;
  margin-bottom: 12px;
}

.hidden {
  display: none;
}

</style>
</head>

    >

      ＋ Eigene Liste erstellen
    </button>

    <div id="customLists"></div>

  </div>


</div>



<!-- ================================================= -->
<!-- PERSONENAUSWAHL -->
<!-- ================================================= -->

<div

>

</div>


</main>

/* =================================================
   SPEICHERN
================================================= */

function saveAll() {

  localStorage.setItem(
    "los_family",
    JSON.stringify(family)
  );

  localStorage.setItem(
    "los_custom_lists",
    JSON.stringify(customLists)
  );

  localStorage.setItem(
    "los_checked_items",
    JSON.stringify(checkedItems)
  );

  localStorage.setItem(
    "los_weather",
    selectedWeather
  );

  localStorage.setItem(
    "los_drive_time",
    selectedDriveTime
  );

}


/* =================================================
   ANZEIGE
================================================= */

function hideAll() {

  document
    .getElementById("home")
    .classList.add("hidden");

  document
    .getElementById("peopleScreen")
    .classList.add("hidden");

  document
    .getElementById("listScreen")
    .classList.add("hidden");

}


function renderHome() {

  hideAll();

  document
    .getElementById("home")
    .classList.remove("hidden");

  renderFamily();

  renderActivities();

  renderCustomLists();

  updateFamilySummary();

  updateWeatherButtons();

  updateDriveButtons();

}


/* =================================================
   WETTER
================================================= */

function selectWeather(weather) {

  selectedWeather = weather;

  saveAll();

  updateWeatherButtons();

}


function updateWeatherButtons() {

  document
    .querySelectorAll(".weather-button")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.weather === selectedWeather
      );

    });

}


/* =================================================
   FAHRZEIT
================================================= */

function selectDriveTime(time) {

  selectedDriveTime = time;

  saveAll();

  updateDriveButtons();

}


function updateDriveButtons() {

  document
    .querySelectorAll(".transport-button")
    .forEach(button => {

      button.classList.toggle(
        "active",
        parseInt(button.dataset.time) === selectedDriveTime
      );

    });

}


/* =================================================
   FAMILIE
================================================= */

function renderFamily() {

  const container =
    document.getElementById("familyList");

  container.innerHTML = "";


  if (family.length === 0) {

    container.innerHTML =
      '<div class="empty">Noch keine Familienmitglieder</div>';

    return;
  }


  family.forEach(
    (person, index) => {

      const div =
        document.createElement("div");

      div.className = "person";

      div.innerHTML = `

        <div class="person-info">

          👤 <strong>
            ${escapeHTML(person.name)}
          </strong>

          <div class="small">
            ${person.age} Jahre
          </div>

        </div>

        <button
          class="danger"
          onclick="deletePerson(${index})"
        >
          ✕
        </button>

      `;

      container.appendChild(div);

    }
  );

}


function addPerson() {

  const name =
    document
      .getElementById("personName")
      .value
      .trim();

  const age =
    parseInt(
      document
        .getElementById("personAge")
        .value
    );


  if (!name || isNaN(age)) {

    alert(
      "Bitte Name und Alter eingeben."
    );

    return;

  }


  family.push({

    id: Date.now(),

    name: name,

    age: age

  });


  document
    .getElementById("personName")
    .value = "";

  document
    .getElementById("personAge")
    .value = "";


  saveAll();

  renderHome();

}


function deletePerson(index) {

  if (
    !confirm(
      "Familienmitglied wirklich löschen?"
    )
  ) {
    return;
  }


  family.splice(index, 1);

  saveAll();

  renderHome();

}


function updateFamilySummary() {

  const element =
    document.getElementById(
      "familySummary"
    );


  if (family.length === 0) {

    element.textContent =
      "Noch keine Familie angelegt";

    return;

  }


  element.textContent =
    family
      .map(
        p =>
          `${p.name} (${p.age})`
      )
      .join(", ");

}


/* =================================================
   AKTIVITÄTEN ANZEIGEN
================================================= */

function renderActivities() {

  const container =
    document.getElementById(
      "activityList"
    );

  container.innerHTML = "";


  Object.keys(activities)
    .forEach(
      name => {

        const button =
          document.createElement(
            "button"
          );

        button.className =
          "list-button";

        button.textContent =
          name;

        button.onclick =
          () => openActivityDirectly(name);

        container.appendChild(
          button
        );

      }
    );

}


/* =================================================
   EMPFEHLUNGEN
================================================= */

function findActivities() {

  const results = [];


  Object.entries(activities)
    .forEach(
      ([name, activity]) => {

        if (
          !activity.weather.includes(
            selectedWeather
          )
        ) {
          return;
        }


        if (
          activity.driveTime >
          selectedDriveTime
        ) {
          return;
        }


        const suitable =
          family.some(
            person =>
              person.age >= activity.minAge &&
              person.age <= activity.maxAge
          );


        if (
          family.length > 0 &&
          !suitable
        ) {
          return;
        }


        let score = 0;


        if (
          activity.weather.includes(
            selectedWeather
          )
        ) {
          score += 3;
        }


        if (
          activity.driveTime <=
          selectedDriveTime
        ) {
          score += 2;
        }


        if (
          activity.type === "indoor" &&
          (
            selectedWeather === "rain" ||
            selectedWeather === "cold"
          )
        ) {
          score += 3;
        }


        if (
          activity.type === "outdoor" &&
          selectedWeather === "sun"
        ) {
          score += 3;
        }


        results.push({

          name,

          ...activity,

          score

        });

      }
    );


  results.sort(
    (a, b) =>
      b.score - a.score
  );


  renderRecommendations(
    results
  );

}


function renderRecommendations(
  results
) {

  const card =
    document.getElementById(
      "recommendationsCard"
    );

  const container =
    document.getElementById(
      "recommendations"
    );


  card.classList.remove(
    "hidden"
  );


  container.innerHTML = "";


  if (
    results.length === 0
  ) {

    container.innerHTML = `

      <div class="notice">

        😕 Für eure aktuellen Einstellungen
        habe ich noch keine passende Aktivität.

        <br><br>

        Versuche eine größere Fahrzeit
        oder ein anderes Wetter.

      </div>

    `;

    return;

  }


  results
    .slice(0, 5)
    .forEach(
      activity => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "activity-card";


        const typeText =
          activity.type === "indoor"
            ? "🏠 Indoor"
            : "🌳 Outdoor";


        const costText =
          activity.cost === 0
            ? "💰 kostenlos"
            : `💰 ca. ${activity.cost} € Familie`;


        div.innerHTML = `

          <div class="activity-top">

            <div>

              <div class="activity-name">
                ${escapeHTML(activity.name)}
              </div>

              <div class="activity-description">
                ${escapeHTML(activity.description)}
              </div>

            </div>

          </div>


          <div class="activity-meta">

            <span class="badge">
              ${typeText}
            </span>

            <span class="badge">
              🚗 ca. ${activity.driveTime} Min.
            </span>

            <span class="badge">
              ${costText}
            </span>

            <span class="badge">
              👶 ab ${activity.minAge} Jahre
            </span>

          </div>


          <button
            class="primary activity-button"
            onclick="openRecommendedActivity('${escapeAttribute(activity.name)}')"
          >
            🚀 Diese Aktivität nehmen
          </button>

        `;


        container.appendChild(
          div
        );

      }
    );

}


/* =================================================
   AKTIVITÄT ÖFFNEN
================================================= */

function openRecommendedActivity(
  name
) {

  openActivityDirectly(
    name
  );

}


function openActivityDirectly(
  name
) {

  currentActivity =
    name;

  selectedPeople = [];

  hideAll();

  document
    .getElementById(
      "peopleScreen"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "selectedActivityTitle"
    )
    .textContent =
      name;


  renderPeopleSelector();

}


/* =================================================
   PERSONENAUSWAHL
================================================= */

function renderPeopleSelector() {

  const container =
    document.getElementById(
      "peopleSelector"
    );

  container.innerHTML = "";


  if (family.length === 0) {

    container.innerHTML = `

      <div class="empty">

        Bitte zuerst Familienmitglieder
        hinzufügen.

      </div>

    `;

    return;

  }


  family.forEach(
    person => {

      const button =
        document.createElement(
          "div"
        );

      button.className =
        "chip";


      if (
        selectedPeople.includes(
          person.id
        )
      ) {

        button.classList.add(
          "active"
        );

      }


      button.textContent =
        `${person.name} (${person.age})`;


      button.onclick =
        () =>
          togglePerson(
            person.id
          );


      container.appendChild(
        button
      );

    }
  );

}


function togglePerson(id) {

  const index =
    selectedPeople.indexOf(
      id
    );


  if (index === -1) {

    selectedPeople.push(
      id
    );

  } else {

    selectedPeople.splice(
      index,
      1
    );

  }


  renderPeopleSelector();

}


/* =================================================
   CHECKLISTE ERSTELLEN
================================================= */

function createFamilyChecklist() {

  if (
    selectedPeople.length === 0
  ) {

    alert(
      "Bitte mindestens eine Person auswählen."
    );

    return;

  }


  buildChecklist();

  hideAll();

  document
    .getElementById(
      "listScreen"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "listTitle"
    )
    .textContent =
      currentActivity;


  document
    .getElementById(
      "listSubtitle"
    )
    .textContent =
      "LOS! hat eure persönliche Liste zusammengestellt";


  renderChecklist();

}


/* =================================================
   CHECKLISTE AUFBAUEN
================================================= */

function buildChecklist() {

  currentItems = [];


  const activity =
    activities[currentActivity];


  /*
     NORMALE AKTIVITÄT
  */

  if (activity) {

    activity.common
      .forEach(
        item => {

          addItem(
            item,
            "Für alle",
            null
          );

        }
      );


    selectedPeople
      .forEach(
        personId => {

          const person =
            family.find(
              p =>
                p.id === personId
            );


          if (!person) return;


          const group =
            getAgeGroup(
              person.age
            );


          const items =
            activity.children[group] || [];


          items.forEach(
            item => {

              addItem(
                item,
                person.name,
                person.id
              );

            }
          );

        }
      );


    return;

  }


  /*
     EIGENE LISTE
  */

  const custom =
    customLists.find(
      list =>
        list.name ===
        currentActivity
    );


  if (custom) {

    custom.items.forEach(
      item => {

        addItem(
          item,
          "Für alle",
          null
        );

      }
    );

  }

}


/* =================================================
   ALTER
================================================= */

function getAgeGroup(
  age
) {

  if (age <= 3) {
    return "baby";
  }

  if (age <= 6) {
    return "small";
  }

  return "older";

}


/* =================================================
   ITEM
================================================= */

function addItem(
  item,
  personName,
  personId
) {

  const id =
    createItemId(
      currentActivity,
      item,
      personId
    );


  const exists =
    currentItems.some(
      x =>
        x.id === id
    );


  if (exists) {
    return;
  }


  currentItems.push({

    id,

    item,

    personName,

    personId

  });

}


/* =================================================
   CHECKLISTE RENDERN
================================================= */

function renderChecklist() {

  const container =
    document.getElementById(
      "checklist"
    );

  container.innerHTML = "";


  if (
    currentItems.length === 0
  ) {

    container.innerHTML =
      '<div class="empty">Noch keine Punkte vorhanden.</div>';

    updateProgress();

    return;

  }


  const common =
    currentItems.filter(
      x =>
        !x.personId
    );


  if (common.length) {

    const title =
      document.createElement(
        "div"
      );

    title.className =
      "section-title";

    title.textContent =
      "👨‍👩‍👧‍👦 Für alle";

    container.appendChild(
      title
    );


    common.forEach(
      item =>
        renderItem(
          item,
          container
        )
    );

  }


  selectedPeople
    .forEach(
      personId => {

        const person =
          family.find(
            p =>
              p.id === personId
          );


        if (!person) {
          return;
        }


        const personItems =
          currentItems.filter(
            x =>
              x.personId ===
              person.id
          );


        if (
          !personItems.length
        ) {
          return;
        }


        const title =
          document.createElement(
            "div"
          );

        title.className =
          "section-title";

        title.textContent =
          `👤 ${person.name} (${person.age})`;


        container.appendChild(
          title
        );


        personItems.forEach(
          item =>
            renderItem(
              item,
              container
            )
        );

      }
    );


  updateProgress();

}


/* =================================================
   ITEM ANZEIGEN
================================================= */

function renderItem(
  item,
  container
) {

  const wrapper =
    document.createElement(
      "label"
    );

  wrapper.className =
    "check-item";


  const checkbox =
    document.createElement(
      "input"
    );

  checkbox.type =
    "checkbox";


  checkbox.checked =
    checkedItems[item.id] === true;


  const text =
    document.createElement(
      "span"
    );

  text.textContent =
    item.item;


  if (
    checkbox.checked
  ) {

    text.classList.add(
      "checked"
    );

  }


  checkbox.onchange =
    () => {

      checkedItems[item.id] =
        checkbox.checked;


      if (
        checkbox.checked
      ) {

        text.classList.add(
          "checked"
        );

      } else {

        text.classList.remove(
          "checked"
        );

      }


      saveAll();

      updateProgress();

    };


  wrapper.appendChild(
    checkbox
  );

  wrapper.appendChild(
    text
  );

  container.appendChild(
    wrapper
  );

}


/* =================================================
   FORTSCHRITT
================================================= */

function updateProgress() {

  const total =
    currentItems.length;


  if (!total) {

    document
      .getElementById(
        "progressBar"
      )
      .style.width =
        "0%";

    return;

  }


  const done =
    currentItems.filter(
      item =>
        checkedItems[item.id]
    ).length;


  const percent =
    Math.round(
      done / total * 100
    );


  document
    .getElementById(
      "progressBar"
    )
    .style.width =
      percent + "%";

}


/* =================================================
   EIGENE LISTEN
================================================= */

function createList() {

  const input =
    document.getElementById(
      "newListName"
    );


  const name =
    input.value.trim();


  if (!name) {

    alert(
      "Bitte einen Namen eingeben."
    );

    return;

  }


  customLists.push({

    name,

    items: []

  });


  input.value = "";

  saveAll();

  renderHome();

}


function renderCustomLists() {

  const container =
    document.getElementById(
      "customLists"
    );

  container.innerHTML = "";


  if (
    customLists.length === 0
  ) {
    return;
  }


  customLists.forEach(
    list => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "list-button";

      button.textContent =
        "📌 " + list.name;

      button.onclick =
        () =>
          openActivityDirectly(
            list.name
          );

      container.appendChild(
        button
      );

    }
  );

}


/* =================================================
   EIGENER PUNKT
================================================= */

function addCustomItem() {

  const item =
    prompt(
      "Was soll noch auf die Liste?"
    );


  if (
    !item ||
    !item.trim()
  ) {
    return;
  }


  addItem(
    item.trim(),
    "Eigener Punkt",
    "custom-" + Date.now()
  );


  renderChecklist();

}


/* =================================================
   RESET
================================================= */

function resetChecklist() {

  if (
    !confirm(
      "Alle erledigten Punkte zurücksetzen?"
    )
  ) {
    return;
  }


  currentItems.forEach(
    item => {

      delete checkedItems[
        item.id
      ];

    }
  );


  saveAll();

  renderChecklist();

}


/* =================================================
   ZURÜCK
================================================= */

function backToPeople() {

  hideAll();

  document
    .getElementById(
      "peopleScreen"
    )
    .classList.remove(
      "hidden"
    );

  renderPeopleSelector();

}


function goHome() {

  currentActivity =
    null;

  selectedPeople = [];

  renderHome();

}


/* =================================================
   ID
================================================= */

function createItemId(
  activity,
  item,
  personId
) {

  return (
    activity +
    "|" +
    item +
    "|" +
    (personId || "all")
  );

}


/* =================================================
   SICHERHEIT
================================================= */

function escapeHTML(
  text
) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  text
) {

  return String(text)
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    );

}


/* =================================================
   START
================================================= */

renderHome();

</script>
