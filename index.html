<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>LOS! – Familien-Starthelfer</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background: #f4f5f9;
  color: #202124;
}

.app {
  max-width: 600px;
  margin: auto;
  min-height: 100vh;
  background: white;
}

header {
  padding: 25px 20px;
  background: linear-gradient(135deg,#667eea,#764ba2);
  color: white;
  border-radius: 0 0 28px 28px;
}

.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  font-size: 42px;
}

h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 3px 0 0;
  opacity: .85;
}

main {
  padding: 22px 18px 50px;
}

h2 {
  margin: 0 0 6px;
  font-size: 25px;
}

h3 {
  margin-bottom: 8px;
}

.subtitle {
  margin: 0 0 20px;
  color: #777;
}

button {
  font-family: inherit;
  cursor: pointer;
}

.family-box {
  background: #f4f5f9;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 25px;
}

.family-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;
}

.person {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: white;
  padding: 12px;
  border-radius: 13px;
  margin-top: 8px;
}

.person-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  font-size: 28px;
}

.person-name {
  font-weight: 600;
}

.person-age {
  font-size: 13px;
  color: #777;
}

.delete {
  border: 0;
  background: #ffecec;
  color: #d33;
  border-radius: 10px;
  padding: 7px 10px;
}

.primary {
  width: 100%;
  border: 0;
  background: #667eea;
  color: white;
  padding: 14px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  margin-top: 12px;
}

.activities {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.activity {
  border: 0;
  background: #f4f5f9;
  border-radius: 18px;
  padding: 17px 12px;
  text-align: left;
  min-height: 125px;
}

.activity:active {
  transform: scale(.97);
}

.activity span {
  display: block;
  font-size: 34px;
  margin-bottom: 8px;
}

.activity strong {
  display: block;
  font-size: 16px;
}

.activity small {
  display: block;
  margin-top: 4px;
  color: #777;
}

.custom {
  width: 100%;
  margin-top: 15px;
  padding: 16px;
  border: 2px dashed #bbb;
  border-radius: 16px;
  background: white;
  font-size: 16px;
}

.back {
  border: 0;
  background: transparent;
  font-size: 16px;
  padding: 0;
  margin-bottom: 20px;
}

.section {
  margin-top: 22px;
}

.person-select {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.person-chip {
  border: 1px solid #ddd;
  background: white;
  border-radius: 20px;
  padding: 9px 13px;
  font-size: 14px;
}

.person-chip.selected {
  background: #667eea;
  color: white;
  border-color: #667eea;
}

.checklist {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 15px;
}

.item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: #f4f5f9;
  border-radius: 15px;
}

.item input {
  width: 22px;
  height: 22px;
}

.done {
  text-decoration: line-through;
  opacity: .45;
}

.progress {
  margin-top: 20px;
  padding: 15px;
  background: #eef0ff;
  border-radius: 15px;
  text-align: center;
  font-weight: 600;
}

.ready {
  display: none;
  margin-top: 15px;
  padding: 18px;
  background: #e7f8ed;
  border-radius: 17px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}

.add-item {
  width: 100%;
  border: 0;
  background: #667eea;
  color: white;
  padding: 14px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  margin-top: 12px;
}

.reset {
  width: 100%;
  border: 1px solid #ddd;
  background: white;
  padding: 13px;
  border-radius: 14px;
  font-size: 15px;
  margin-top: 10px;
}

.item-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.item-row .item {
  flex: 1;
}

.delete-item {
  border: 0;
  background: #ffecec;
  color: #d33;
  border-radius: 10px;
  padding: 10px;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
}

.modal-content {
  width: 100%;
  max-width: 600px;
  background: white;
  padding: 25px 20px 35px;
  border-radius: 25px 25px 0 0;
}

.modal-content h2 {
  margin-bottom: 18px;
}

input[type="text"],
input[type="number"] {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
  margin-bottom: 12px;
}

.modal-buttons {
  display: flex;
  gap: 10px;
}

.cancel,
.save {
  flex: 1;
  border: 0;
  padding: 14px;
  border-radius: 12px;
  font-size: 16px;
}

.cancel {
  background: #eee;
}

.save {
  background: #667eea;
  color: white;
  font-weight: bold;
}

.suggestion {
  background: #fff7df;
  border-radius: 15px;
  padding: 14px;
  margin-top: 12px;
}

.suggestion-title {
  font-weight: bold;
  margin-bottom: 8px;
}

.suggestion button {
  border: 0;
  background: white;
  border-radius: 10px;
  padding: 8px 10px;
  margin: 4px 3px 0 0;
}

.empty {
  text-align: center;
  padding: 15px;
  color: #777;
}

.small-note {
  color: #777;
  font-size: 13px;
  margin-top: 8px;
}

</style>
</head>

<body>

<div class="app">

<header>

<div class="header-top">

<div class="logo">🚀</div>

<div>

<h1>LOS!</h1>

<p>Familien-Starthelfer</p>

</div>

</div>

</header>

<main id="app"></main>

</div>


<!-- FAMILIENMITGLIED -->

<div class="modal" id="personModal">

<div class="modal-content">

<h2>👤 Familienmitglied</h2>

<input
id="personName"
type="text"
placeholder="Name">

<input
id="personAge"
type="number"
placeholder="Alter"
min="0"
max="99">

<div class="modal-buttons">

<button
class="cancel"
onclick="closeModal('personModal')">

Abbrechen

</button>

<button
class="save"
onclick="savePerson()">

Speichern

</button>

</div>

</div>

</div>


<!-- NEUE LISTE -->

<div class="modal" id="listModal">

<div class="modal-content">

<h2>📋 Neue Liste</h2>

<input
id="listName"
type="text"
placeholder="z.B. Zoo">

<div class="modal-buttons">

<button
class="cancel"
onclick="closeModal('listModal')">

Abbrechen

</button>

<button
class="save"
onclick="saveList()">

Erstellen

</button>

</div>

</div>

</div>


<!-- NEUER PUNKT -->

<div class="modal" id="itemModal">

<div class="modal-content">

<h2>➕ Neuer Punkt</h2>

<input
id="itemName"
type="text"
placeholder="z.B. Trinkflasche">

<div class="modal-buttons">

<button
class="cancel"
onclick="closeModal('itemModal')">

Abbrechen

</button>

<button
class="save"
onclick="saveItem()">

Hinzufügen

</button>

</div>

</div>

</div>


<script>

/* =========================
   STANDARDLISTEN
========================= */

const defaultLists = {

"Schwimmbad": {
emoji:"🏊",
items:[
"Badehose / Badeanzug",
"Handtuch",
"Schwimmflügel",
"Trinkflasche",
"Sonnencreme",
"Wechselkleidung",
"Schwimmwindeln",
"Snacks"
]
},

"Kindergarten": {
emoji:"🏫",
items:[
"Kindergarten-Rucksack",
"Trinkflasche",
"Brotdose",
"Hausschuhe",
"Wechselkleidung",
"Jacke"
]
},

"Spielplatz": {
emoji:"🌳",
items:[
"Jacke",
"Trinkflasche",
"Snacks",
"Sonnencreme",
"Mütze"
]
},

"Oma & Opa": {
emoji:"👵",
items:[
"Kinderkleidung",
"Trinkflasche",
"Snacks",
"Lieblingsspielzeug",
"Wechselkleidung"
]
},

"Einkaufen": {
emoji:"🛒",
items:[
"Einkaufstaschen",
"Einkaufszettel",
"Portemonnaie",
"Trinkflaschen"
]
},

"Urlaub": {
emoji:"✈️",
items:[
"Kleidung",
"Unterwäsche",
"Zahnbürsten",
"Medikamente",
"Spielzeug",
"Ladegeräte",
"Reisedokumente",
"Snacks"
]
}

};


/* =========================
   ALTERSABHÄNGIGE VORSCHLÄGE
========================= */

const ageSuggestions = {

"Schwimmbad": {

baby:[
"Schwimmwindeln",
"Babyhandtuch",
"Wechselkleidung"
],

young:[
"Schwimmwindeln",
"Schwimmflügel",
"Spielzeug"
],

older:[
"Schwimmbrille",
"Schwimmflügel"
]

},

"Urlaub": {

baby:[
"Windeln",
"Feuchttücher",
"Babyflasche"
],

young:[
"Windeln",
"Feuchttücher",
"Lieblingsspielzeug"
],

older:[
"Reisebeschäftigung",
"Kopfhörer"
]

},

"Spielplatz": {

baby:[
"Windeln",
"Feuchttücher",
"Babytrage"
],

young:[
"Sandspielzeug",
"Wechselkleidung"
],

older:[
"Ball",
"Fahrradhelm"
]

}

};


/* =========================
   DATEN LADEN
========================= */

let family =
JSON.parse(
localStorage.getItem("losFamily")
) || [];

let customLists =
JSON.parse(
localStorage.getItem("losLists")
) || {};

let currentList = null;

let selectedPeople = [];

let checkedItems = {};


/* =========================
   SPEICHERN
========================= */

function saveData() {

localStorage.setItem(
"losFamily",
JSON.stringify(family)
);

localStorage.setItem(
"losLists",
JSON.stringify(customLists)
);

}


/* =========================
   STARTSEITE
========================= */

function renderHome() {

currentList = null;

let html = `

<h2>Hallo Familie 👋</h2>

<p class="subtitle">
Was machen wir heute?
</p>

<div class="family-box">

<div class="family-title">

<span>👨‍👩‍👧 Meine Familie</span>

</div>
`;


if(family.length === 0) {

html += `

<div class="empty">
Noch keine Familienmitglieder.
</div>

`;

}


family.forEach((person,index) => {

html += `

<div class="person">

<div class="person-info">

<div class="avatar">
${index === 0 ? "👦" : "👧"}
</div>

<div>

<div class="person-name">
${escapeHTML(person.name)}
</div>

<div class="person-age">
${person.age} Jahre
</div>

</div>

</div>

<button
class="delete"
onclick="deletePerson(${index})">

🗑️

</button>

</div>

`;

});


html += `

<button
class="primary"
onclick="openPersonModal()">

＋ Familienmitglied hinzufügen

</button>

</div>

<h2>Was machen wir?</h2>

<p class="subtitle">
Wähle eine Checkliste.
</p>

<div class="activities">
`;


Object.keys(defaultLists).forEach(name => {

const list = defaultLists[name];

html += `

<button
class="activity"
onclick="openList('${escapeAttribute(name)}')">

<span>${list.emoji}</span>

<strong>${name}</strong>

<small>Checkliste öffnen</small>

</button>

`;

});


Object.keys(customLists).forEach(name => {

const list = customLists[name];

html += `

<button
class="activity"
onclick="openList('${escapeAttribute(name)}')">

<span>${list.emoji}</span>

<strong>${escapeHTML(name)}</strong>

<small>Eigene Liste</small>

</button>

`;

});


html += `

</div>

<button
class="custom"
onclick="openListModal()">

＋ Eigene Liste erstellen

</button>

`;


document.getElementById("app").innerHTML = html;

}


/* =========================
   LISTE ÖFFNEN
========================= */

function openList(name) {

currentList = name;

selectedPeople = [];

const list =
defaultLists[name] ||
customLists[name];

let html = `

<button
class="back"
onclick="renderHome()">

← Zurück

</button>

<h2>
${list.emoji} ${escapeHTML(name)}
</h2>

<p class="subtitle">
Was müssen wir mitnehmen?
</p>
`;


/* FAMILIENMITGLIEDER */

if(family.length > 0) {

html += `

<div class="section">

<h3>👨‍👩‍👧 Für wen?</h3>

<div class="person-select">
`;

family.forEach((person,index) => {

html += `

<button
class="person-chip"
id="personChip${index}"
onclick="togglePerson(${index})">

${escapeHTML(person.name)}
 · ${person.age}

</button>

`;

});

html += `

</div>

<p class="small-note">
Wähle die Familienmitglieder aus,
für die die Liste gilt.
</p>

</div>

`;

}


/* VORSCHLÄGE */

const suggestions =
getSuggestions(name);

if(suggestions.length > 0) {

html += `

<div class="suggestion">

<div class="suggestion-title">
💡 Vorschläge für eure Familie
</div>

`;

suggestions.forEach(item => {

html += `

<button
onclick="addSuggestedItem('${escapeAttribute(item)}')">

＋ ${escapeHTML(item)}

</button>

`;

});

html += `

</div>

`;

}


/* CHECKLISTE */

html += `

<div class="section">

<h3>🎒 Mitnehmen</h3>

<div
class="checklist"
id="checklist">

`;


list.items.forEach((item,index) => {

const key =
getItemKey(name,index);

const checked =
checkedItems[key] === true;

html += `

<div class="item-row">

<label class="item">

<input
type="checkbox"
${checked ? "checked" : ""}
onchange="checkItem(this,${index})">

<span
class="${checked ? "done" : ""}">

${escapeHTML(item)}

</span>

</label>
`;


if(customLists[name]) {

html += `

<button
class="delete-item"
onclick="deleteItem(${index})">

🗑️

</button>

`;

}

html += `

</div>

`;

});


html += `

</div>

</div>

`;


/* EIGENEN PUNKT */

if(customLists[name]) {

html += `

<button
class="add-item"
onclick="openItemModal()">

＋ Punkt hinzufügen

</button>

`;

}


/* FORTSCHRITT */

html += `

<div class="progress">

<span id="counter">
${getCheckedCount(name)}
</span>

/

${list.items.length}

erledigt

</div>

<div
class="ready"
id="ready"
style="${
getCheckedCount(name) === list.items.length &&
list.items.length > 0
? "display:block"
: ""
}">

🎉 ALLES DABEI!

<br>

Dann kann es losgehen! 🚗

</div>

<button
class="reset"
onclick="resetList()">

↻ Checkliste zurücksetzen

</button>

`;


document.getElementById("app").innerHTML = html;

}


/* =========================
   FAMILIENMITGLIED AUSWÄHLEN
========================= */

function togglePerson(index) {

const position =
selectedPeople.indexOf(index);

if(position >= 0) {

selectedPeople.splice(position,1);

} else {

selectedPeople.push(index);

}

const button =
document.getElementById(
"personChip" + index
);

if(button) {

button.classList.toggle(
"selected",
selectedPeople.includes(index)
);

}

}


/* =========================
   VORSCHLÄGE ERMITTELN
========================= */

function getSuggestions(name) {

if(!ageSuggestions[name] ||
family.length === 0) {

return [];

}

let result = [];

family.forEach(person => {

let age =
parseInt(person.age);

let group;

if(age < 2) {

group = "baby";

} else if(age <= 4) {

group = "young";

} else {

group = "older";

}

const suggestions =
ageSuggestions[name][group] || [];

suggestions.forEach(item => {

if(!result.includes(item)) {

result.push(item);

}

});

});

return result;

}


/* =========================
   VORSCHLAG HINZUFÜGEN
========================= */

function addSuggestedItem(item) {

const list =
customLists[currentList];

if(!list) {

alert(
"Altersvorschläge können momentan nur in eigenen Listen gespeichert werden."
);

return;

}

if(!list.items.includes(item)) {

list.items.push(item);

saveData();

}

openList(currentList);

}


/* =========================
   CHECKBOX
========================= */

function getItemKey(name,index) {

return name + "_" + index;

}


function checkItem(checkbox,index) {

const key =
getItemKey(currentList,index);

checkedItems[key] =
checkbox.checked;

const text =
checkbox.parentElement
.querySelector("span");

if(checkbox.checked) {

text.classList.add("done");

} else {

text.classList.remove("done");

}

const count =
getCheckedCount(currentList);

document.getElementById(
"counter"
).textContent = count;

const list =
defaultLists[currentList] ||
customLists[currentList];

if(
count === list.items.length &&
list.items.length > 0
) {

document.getElementById(
"ready"
).style.display = "block";

} else {

document.getElementById(
"ready"
).style.display = "none";

}

}


function getCheckedCount(name) {

const list =
defaultLists[name] ||
customLists[name];

if(!list) return 0;

let count = 0;

list.items.forEach((item,index) => {

if(
checkedItems[getItemKey(name,index)]
) {

count++;

}

});

return count;

}


/* =========================
   CHECKLIST ZURÜCKSETZEN
========================= */

function resetList() {

const list =
defaultLists[currentList] ||
customLists[currentList];

if(!list) return;

list.items.forEach((item,index) => {

delete checkedItems[
getItemKey(currentList,index)
];

});

openList(currentList);

}


/* =========================
   FAMILIENMITGLIED
========================= */

function openPersonModal() {

document.getElementById(
"personModal"
).style.display = "flex";

document.getElementById(
"personName"
).value = "";

document.getElementById(
"personAge"
).value = "";

}


function savePerson() {

const name =
document.getElementById(
"personName"
).value.trim();

const age =
document.getElementById(
"personAge"
).value;


if(!name || age === "") {

alert(
"Bitte Name und Alter eingeben."
);

return;

}


family.push({

name:name,

age:age

});


saveData();

closeModal("personModal");

renderHome();

}


function deletePerson(index) {

if(
confirm(
"Familienmitglied wirklich löschen?"
)
) {

family.splice(index,1);

saveData();

renderHome();

}

}


/* =========================
   EIGENE LISTE
========================= */

function openListModal() {

document.getElementById(
"listModal"
).style.display = "flex";

document.getElementById(
"listName"
).value = "";

}


function saveList() {

const name =
document.getElementById(
"listName"
).value.trim();

if(!name) {

alert(
"Bitte einen Namen eingeben."
);

return;

}

if(
defaultLists[name] ||
customLists[name]
) {

alert(
"Diese Liste gibt es bereits."
);

return;

}

customLists[name] = {

emoji:"📋",

items:[]

};

saveData();

closeModal("listModal");

openList(name);

}


/* =========================
   EIGENEN PUNKT
========================= */

function openItemModal() {

document.getElementById(
"itemModal"
).style.display = "flex";

document.getElementById(
"itemName"
).value = "";

}


function saveItem() {

const item =
document.getElementById(
"itemName"
).value.trim();

if(!item) {

alert(
"Bitte einen Punkt eingeben."
);

return;

}

const list =
customLists[currentList];

if(!list) return;

if(list.items.includes(item)) {

alert(
"Dieser Punkt ist bereits vorhanden."
);

return;

}

list.items.push(item);

saveData();

closeModal("itemModal");

openList(currentList);

}


/* =========================
   PUNKT LÖSCHEN
========================= */

function deleteItem(index) {

if(!customLists[currentList])
return;

if(
confirm(
"Diesen Punkt wirklich löschen?"
)
) {

customLists[currentList]
.items.splice(index,1);

saveData();

openList(currentList);

}

}


/* =========================
   MODAL
========================= */

function closeModal(id) {

document.getElementById(id)
.style.display = "none";

}


/* =========================
   HTML SICHERHEIT
========================= */

function escapeHTML(text) {

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttribute(text) {

return String(text)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}


/* =========================
   START
========================= */

renderHome();

</script>

</body>
</html>
