<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>LOS! – Familien-Starthelfer</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background: #f4f5f9;
  color: #202124;
}

.app {
  max-width: 600px;
  margin: auto;
  min-height: 100vh;
  background: white;
}

header {
  padding: 25px 20px;
  background: linear-gradient(135deg,#667eea,#764ba2);
  color: white;
  border-radius: 0 0 28px 28px;
}

.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  font-size: 42px;
}

h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 3px 0 0;
  opacity: .85;
}

main {
  padding: 22px 18px 50px;
}

h2 {
  margin: 0 0 6px;
  font-size: 25px;
}

h3 {
  margin-bottom: 8px;
}

.subtitle {
  margin: 0 0 20px;
  color: #777;
}

button {
  font-family: inherit;
  cursor: pointer;
}

.family-box {
  background: #f4f5f9;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 25px;
}

.family-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: bold;
}

.person {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: white;
  padding: 12px;
  border-radius: 13px;
  margin-top: 8px;
}

.person-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  font-size: 28px;
}

.person-name {
  font-weight: 600;
}

.person-age {
  font-size: 13px;
  color: #777;
}

.delete {
  border: 0;
  background: #ffecec;
  color: #d33;
  border-radius: 10px;
  padding: 7px 10px;
}

.primary {
  width: 100%;
  border: 0;
  background: #667eea;
  color: white;
  padding: 14px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  margin-top: 12px;
}

.activities {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.activity {
  border: 0;
  background: #f4f5f9;
  border-radius: 18px;
  padding: 17px 12px;
  text-align: left;
  min-height: 125px;
}

.activity:active {
  transform: scale(.97);
}

.activity span {
  display: block;
  font-size: 34px;
  margin-bottom: 8px;
}

.activity strong {
  display: block;
  font-size: 16px;
}

.activity small {
  display: block;
  margin-top: 4px;
  color: #777;
}

.custom {
  width: 100%;
  margin-top: 15px;
  padding: 16px;
  border: 2px dashed #bbb;
  border-radius: 16px;
  background: white;
  font-size: 16px;
}

.back {
  border: 0;
  background: transparent;
  font-size: 16px;
  padding: 0;
  margin-bottom: 20px;
}

.section {
  margin-top: 22px;
}

.person-select {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.person-chip {
  border: 1px solid #ddd;
  background: white;
  border-radius: 20px;
  padding: 9px 13px;
  font-size: 14px;
}

.person-chip.selected {
  background: #667eea;
  color: white;
  border-color: #667eea;
}

.checklist {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 15px;
}

.item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: #f4f5f9;
  border-radius: 15px;
}

.item input {
  width: 22px;
  height: 22px;
}

.done {
  text-decoration: line-through;
  opacity: .45;
}

.progress {
  margin-top: 20px;
  padding: 15px;
  background: #eef0ff;
  border-radius: 15px;
  text-align: center;
  font-weight: 600;
}

.ready {
  display: none;
  margin-top: 15px;
  padding: 18px;
  background: #e7f8ed;
  border-radius: 17px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}

.add-item {
  width: 100%;
  border: 0;
  background: #667eea;
  color: white;
  padding: 14px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  margin-top: 12px;
}

.reset {
  width: 100%;
  border: 1px solid #ddd;
  background: white;
  padding: 13px;
  border-radius: 14px;
  font-size: 15px;
  margin-top: 10px;
}

.item-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.item-row .item {
  flex: 1;
}

.delete-item {
  border: 0;
  background: #ffecec;
  color: #d33;
  border-radius: 10px;
  padding: 10px;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
}

.modal-content {
  width: 100%;
  max-width: 600px;
  background: white;
  padding: 25px 20px 35px;
  border-radius: 25px 25px 0 0;
}

.modal-content h2 {
  margin-bottom: 18px;
}

input[type="text"],
input[type="number"] {
  width: 100%;
  padding: 14px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
  margin-bottom: 12px;
}

.modal-buttons {
  display: flex;
  gap: 10px;
}

.cancel,
.save {
  flex: 1;
  border: 0;
  padding: 14px;
  border-radius: 12px;
  font-size: 16px;
}

.cancel {
  background: #eee;
}

.save {
  background: #667eea;
  color: white;
  font-weight: bold;
}

.suggestion {
  background: #fff7df;
  border-radius: 15px;
  padding: 14px;
  margin-top: 12px;
}

.suggestion-title {
  font-weight: bold;
  margin-bottom: 8px;
}

.suggestion button {
  border: 0;
  background: white;
  border-radius: 10px;
  padding: 8px 10px;
  margin: 4px 3px 0 0;
}

.empty {
  text-align: center;
  padding: 15px;
  color: #777;
}

.small-note {
  color: #777;
  font-size: 13px;
  margin-top: 8px;
}

</style>
</head>

<body>

<div class="app">

<header>

<div class="header-top">

<div class="logo">🚀</div>

<div>

<h1>LOS!</h1>

<p>Familien-Starthelfer</p>

</div>

</div>

</header>

<main id="app"></main>

</div>


<!-- FAMILIENMITGLIED -->

<div class="modal" id="personModal">

<div class="modal-content">

<h2>👤 Familienmitglied</h2>

<input
id="personName"
type="text"
placeholder="Name">

<input
id="personAge"
type="number"
placeholder="Alter"
min="0"
max="99">

<div class="modal-buttons">

<button
class="cancel"
onclick="closeModal('personModal')">

Abbrechen

</button>

<button
class="save"
onclick="savePerson()">

Speichern

</button>

</div>

</div>

</div>


<!-- NEUE LISTE -->

<div class="modal" id="listModal">

<div class="modal-content">

<h2>📋 Neue Liste</h2>

<input
id="listName"
type="text"
placeholder="z.B. Zoo">

<div class="modal-buttons">

<button
class="cancel"
onclick="closeModal('listModal')">

Abbrechen

</button>

<button
class="save"
onclick="saveList()">

Erstellen

</button>

</div>

</div>

</div>


<!-- NEUER PUNKT -->

<div class="modal" id="itemModal">

<div class="modal-content">

<h2>➕ Neuer Punkt</h2>

<input
id="itemName"
type="text"
placeholder="z.B. Trinkflasche">

<div class="modal-buttons">

<button
class="cancel"
onclick="closeModal('itemModal')">

Abbrechen

</button>

<button
class="save"
onclick="saveItem()">

Hinzufügen

</button>

</div>

</div>

</div>
